<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bakken Inspect">
<title>Bakken Elite Inspection</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f2f2f7;color:#1c1c1e;font-size:15px;}

/* App shell */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
#content-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
#tab-bar{flex-shrink:0;display:flex;background:#fff;border-top:0.5px solid #c6c6c8;padding-bottom:env(safe-area-inset-bottom,0px);}

/* Screens */
.screen{display:none;min-height:100%;}
.screen.active{display:block;}

/* Tab buttons */
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 0 5px;gap:2px;background:none;border:none;cursor:pointer;-webkit-appearance:none;}
.tab-icon{font-size:19px;line-height:1;}
.tab-label{font-size:9px;color:#8e8e93;font-family:-apple-system,sans-serif;}
.tab.active .tab-label{color:#004b8d;}

/* Nav */
.nav{background:#fff;border-bottom:0.5px solid #c6c6c8;padding:10px 12px 7px;position:sticky;top:0;z-index:10;}
.nav-title{font-size:16px;font-weight:600;text-align:center;color:#1c1c1e;}
.nav-sub{font-size:11px;color:#8e8e93;text-align:center;margin-top:1px;}
.nav-row{display:flex;align-items:center;justify-content:space-between;}
.nav-btn{background:none;border:none;color:#004b8d;font-size:14px;font-weight:500;cursor:pointer;padding:0;}

/* Content padding */
.content{padding:10px 12px 20px;}

/* Cards */
.card{background:#fff;border-radius:10px;overflow:hidden;margin-bottom:10px;}
.card-header{padding:8px 14px;border-bottom:0.5px solid #f2f2f7;font-size:11px;font-weight:600;color:#8e8e93;text-transform:uppercase;letter-spacing:0.05em;}
.row{display:flex;align-items:center;border-bottom:0.5px solid #f2f2f7;padding:0 14px;}
.row:last-child{border-bottom:none;}
.row label{font-size:14px;color:#1c1c1e;min-width:76px;padding:11px 8px 11px 0;flex-shrink:0;}
.row input,.row select,.row textarea{flex:1;border:none;outline:none;font-size:14px;color:#1c1c1e;background:transparent;padding:11px 0;font-family:inherit;}
.row select{-webkit-appearance:none;}

/* Findings */
.finding{background:#fff;border-radius:10px;margin-bottom:10px;overflow:hidden;}
.finding-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:0.5px solid #f2f2f7;}
.finding-num{font-size:14px;font-weight:600;}
.status-pill{font-size:12px;font-weight:600;padding:4px 11px;border-radius:20px;cursor:pointer;border:none;-webkit-appearance:none;}
.pill-ok{background:#d1fae5;color:#065f46;}
.pill-monitor{background:#fef3c7;color:#92400e;}
.pill-action{background:#fee2e2;color:#991b1b;}
.remove-btn{background:none;border:none;font-size:22px;color:#c7c7cc;padding:0 0 0 8px;cursor:pointer;line-height:1;}

/* Photos */
.photo-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px;}
.photo-box{border:1.5px dashed #c6c6c8;border-radius:8px;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;overflow:hidden;background:#fafafa;}
.photo-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:zoom-in;}
.photo-box input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;z-index:2;}
.photo-box.loaded input{z-index:0;}
.photo-box-lbl{font-size:11px;color:#8e8e93;text-align:center;padding:0 4px;}
.photo-box-ico{font-size:22px;}
.photo-box.loaded .photo-box-lbl,.photo-box.loaded .photo-box-ico{display:none;}
.photo-clear{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);z-index:3;background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:20px;font-size:11px;padding:4px 10px;cursor:pointer;white-space:nowrap;-webkit-appearance:none;}

/* Checklist */
.check-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:0.5px solid #f2f2f7;cursor:pointer;}
.check-row:last-child{border-bottom:none;}
.check-circle{width:24px;height:24px;border-radius:50%;border:2px solid #c6c6c8;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.check-circle.on{background:#004b8d;border-color:#004b8d;}
.check-circle svg{display:none;}
.check-circle.on svg{display:block;}
.check-lbl{font-size:14px;color:#1c1c1e;line-height:1.35;}
.cat-hdr{font-size:11px;font-weight:600;color:#8e8e93;text-transform:uppercase;letter-spacing:0.05em;padding:12px 14px 4px;background:#fff;}

/* Summary bar */
.sum-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
.sum-card{background:#fff;border-radius:10px;padding:10px 6px;text-align:center;}
.sum-n{font-size:24px;font-weight:700;}
.sum-l{font-size:11px;color:#8e8e93;margin-top:2px;}
.c-ok .sum-n{color:#065f46;}
.c-mon .sum-n{color:#92400e;}
.c-act .sum-n{color:#991b1b;}

/* Buttons */
.btn-primary{width:100%;padding:14px;background:#004b8d;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:10px;display:block;-webkit-appearance:none;}
.btn-secondary{width:100%;padding:12px;background:#fff;color:#636366;border:1px solid #c6c6c8;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:10px;display:block;-webkit-appearance:none;}
.btn-add{width:100%;padding:12px;background:#fff;color:#004b8d;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:6px;-webkit-appearance:none;}
.notes-box{background:#fff;border-radius:10px;overflow:hidden;margin-bottom:10px;}
.notes-box textarea{width:100%;border:none;outline:none;font-size:14px;color:#1c1c1e;padding:12px 14px;font-family:inherit;min-height:96px;resize:none;display:block;}
.finding-notes{width:100%;border:1px solid #e5e5ea;border-radius:8px;padding:9px 11px;font-size:14px;font-family:-apple-system,sans-serif;color:#1c1c1e;outline:none;resize:none;min-height:66px;}

/* History */
.hist-item{background:#fff;border-radius:10px;margin-bottom:10px;overflow:hidden;}
.hist-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;}
.hist-name{font-size:15px;font-weight:600;color:#1c1c1e;}
.hist-date{font-size:12px;color:#8e8e93;margin-top:2px;}
.hist-badges{display:flex;gap:5px;align-items:center;flex-shrink:0;margin-left:8px;flex-wrap:wrap;justify-content:flex-end;}
.hist-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;}
.hb-ok{background:#d1fae5;color:#065f46;}
.hb-mon{background:#fef3c7;color:#92400e;}
.hb-act{background:#fee2e2;color:#991b1b;}
.hist-actions{display:flex;border-top:0.5px solid #f2f2f7;}
.hist-btn{flex:1;padding:11px;background:none;border:none;font-size:13px;font-weight:500;cursor:pointer;color:#004b8d;-webkit-appearance:none;}
.hist-btn.danger{color:#d93025;}
.hist-btn+.hist-btn{border-left:0.5px solid #f2f2f7;}
.empty-state{text-align:center;padding:48px 24px;color:#8e8e93;}
.empty-icon{font-size:40px;margin-bottom:12px;}
.empty-title{font-size:16px;font-weight:500;color:#3a3a3c;margin-bottom:6px;}
.empty-sub{font-size:13px;line-height:1.5;}

/* Autosave dot */
.autosave-dot{width:7px;height:7px;border-radius:50%;background:#34c759;display:inline-block;margin-right:4px;transition:background 0.3s;}

/* Lightbox */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:99999;align-items:center;justify-content:center;}
.lightbox.open{display:flex;}
.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain;border-radius:6px;}
.lightbox-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:26px;width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-appearance:none;}
</style>
</head>
<body>

<div id="app">
  <div id="content-area">

    <!-- Customer screen -->
    <div class="screen active" id="screen-customer">
      <div class="nav">
        <div class="nav-row">
          <span class="autosave-dot" id="save-dot" style="opacity:0;"></span>
          <div class="nav-title" style="flex:1;text-align:center;">Elite Inspection</div>
          <button class="nav-btn" id="new-btn">New</button>
        </div>
        <div class="nav-sub" id="current-label">Customer info</div>
      </div>
      <div class="content">
        <div class="card">
          <div class="card-header">Customer</div>
          <div class="row"><label>Name</label><input type="text" id="cust-name" placeholder="Jane Smith"></div>
          <div class="row"><label>Address</label><input type="text" id="cust-addr" placeholder="123 Main St, Minneapolis MN"></div>
        </div>
        <div class="card">
          <div class="card-header">Inspection</div>
          <div class="row"><label>Date</label><input type="date" id="insp-date"></div>
          <div class="row"><label>Tech</label><input type="text" id="tech-name" placeholder="Nils"></div>
          <div class="row"><label>Year</label>
            <select id="mem-year"><option>Year 1</option><option>Year 2</option><option>Year 3</option><option>Year 4</option><option>Year 5+</option></select>
          </div>
        </div>
      </div>
    </div>

    <!-- Findings screen -->
    <div class="screen" id="screen-findings">
      <div class="nav"><div class="nav-title">Thermal Findings</div><div class="nav-sub">Tap status badge to cycle severity</div></div>
      <div class="content">
        <div class="sum-row">
          <div class="sum-card c-ok"><div class="sum-n" id="sum-ok">0</div><div class="sum-l">Normal</div></div>
          <div class="sum-card c-mon"><div class="sum-n" id="sum-mon">0</div><div class="sum-l">Monitor</div></div>
          <div class="sum-card c-act"><div class="sum-n" id="sum-act">0</div><div class="sum-l">Action</div></div>
        </div>
        <div id="findings-list"></div>
        <button class="btn-add" id="add-finding-btn"><span style="font-size:20px;font-weight:300;">+</span> Add finding</button>
      </div>
    </div>

    <!-- Checklist screen -->
    <div class="screen" id="screen-checklist">
      <div class="nav"><div class="nav-title">Checklist</div><div class="nav-sub" id="ck-prog">0 of 11 complete</div></div>
      <div class="content">
        <div class="card" id="ck-list"></div>
      </div>
    </div>

    <!-- Summary screen -->
    <div class="screen" id="screen-summary">
      <div class="nav"><div class="nav-title">Summary & Report</div><div class="nav-sub">Final notes before generating</div></div>
      <div class="content">
        <div class="card">
          <div class="card-header">Next visit</div>
          <div class="row">
            <select id="next-visit" style="width:100%;padding:14px 0;">
              <option>12 months (standard)</option>
              <option>6 months (monitor required)</option>
              <option>3 months (action required)</option>
              <option>Immediate follow-up needed</option>
            </select>
          </div>
        </div>
        <div class="notes-box"><textarea id="overall-notes" placeholder="Overall notes and recommendations..."></textarea></div>
        <button class="btn-primary" id="gen-report-btn">Generate &amp; Print Report</button>
        <button class="btn-secondary" id="new-insp-btn">Start new inspection</button>
      </div>
    </div>

    <!-- History screen -->
    <div class="screen" id="screen-history">
      <div class="nav"><div class="nav-title">Inspection History</div><div class="nav-sub" id="hist-count">0 inspections saved</div></div>
      <div class="content" id="hist-list"></div>
    </div>

  </div><!-- end content-area -->

  <!-- Tab bar INSIDE app flex container, not fixed -->
  <div id="tab-bar">
    <button class="tab active" data-screen="customer"><span class="tab-icon">&#128100;</span><span class="tab-label">Customer</span></button>
    <button class="tab" data-screen="findings"><span class="tab-icon">&#128293;</span><span class="tab-label">Findings</span></button>
    <button class="tab" data-screen="checklist"><span class="tab-icon">&#9989;</span><span class="tab-label">Checklist</span></button>
    <button class="tab" data-screen="summary"><span class="tab-icon">&#128196;</span><span class="tab-label">Report</span></button>
    <button class="tab" data-screen="history"><span class="tab-icon">&#128197;</span><span class="tab-label">History</span></button>
  </div>

</div><!-- end app -->

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">&times;</button>
  <img id="lightbox-img" src="" alt="Zoomed photo">
</div>

var CHECKS=[
  {id:"c1",label:"Full panel thermal scan completed",cat:"Thermal imaging"},
  {id:"c2",label:"Panel cover removed and inspected",cat:"Thermal imaging"},
  {id:"c3",label:"Main breaker torque verified",cat:"Torque check"},
  {id:"c4",label:"All branch breakers torqued to spec",cat:"Torque check"},
  {id:"c5",label:"Neutral bar connections verified",cat:"Torque check"},
  {id:"c6",label:"Ground bar connections verified",cat:"Torque check"},
  {id:"c7",label:"EV charger present (skip if N/A)",cat:"EV charger"},
  {id:"c8",label:"EV charger thermal scan completed",cat:"EV charger"},
  {id:"c9",label:"EV charger wire connections inspected",cat:"EV charger"},
  {id:"c10",label:"EV charger mounting and enclosure checked",cat:"EV charger"},
  {id:"c11",label:"Written findings reviewed with customer",cat:"Wrap-up"}
];

var checked={};
var findings=[];
var fc=0;
var currentId=null;
var saveTimer=null;

// ---- TAB NAV ----
document.querySelectorAll('.tab').forEach(function(btn){
  btn.addEventListener('click', function(){
    var name = this.getAttribute('data-screen');
    document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
    document.getElementById('screen-'+name).classList.add('active');
    document.getElementById('content-area').scrollTop=0;
    this.classList.add('active');
    if(name==='findings') updateBar();
    if(name==='history') renderHistory();
  });
});

function switchTab(name){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('content-area').scrollTop=0;
  document.querySelector('[data-screen="'+name+'"]').classList.add('active');
}

// ---- CHECKLIST ----
function buildCL(){
  var el=document.getElementById('ck-list');
  var lastCat='';
  CHECKS.forEach(function(item){
    if(item.cat!==lastCat){
      lastCat=item.cat;
      var h=document.createElement('div');
      h.className='cat-hdr';h.textContent=item.cat;el.appendChild(h);
    }
    var r=document.createElement('div');
    r.className='check-row';
    r.addEventListener('click',function(){toggleCk(item.id);});
    r.innerHTML='<div class="check-circle" id="box-'+item.id+'"><svg width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M1 5L5 9L13 1" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="check-lbl">'+item.label+'</span>';
    el.appendChild(r);
  });
}

function toggleCk(id){
  checked[id]=!checked[id];
  var b=document.getElementById('box-'+id);
  if(checked[id])b.classList.add('on');else b.classList.remove('on');
  var done=Object.values(checked).filter(Boolean).length;
  document.getElementById('ck-prog').textContent=done+' of '+CHECKS.length+' complete';
  autoSave();
}

// ---- FINDINGS ----
var SCYCLE=['ok','monitor','action'];
var SLBL={ok:'Normal',monitor:'Monitor',action:'Action required'};
var SCLS={ok:'pill-ok',monitor:'pill-monitor',action:'pill-action'};

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

function addFinding(obj){
  fc++;
  var id=fc;
  var f=obj?Object.assign({},obj):{id:id,status:'ok',location:'',temp:'',notes:'',thermalSrc:null,visibleSrc:null};
  f.id=id;
  findings.push(f);

  var d=document.createElement('div');
  d.className='finding';
  d.id='finding-'+id;

  // Build HTML safely
  d.innerHTML=[
    '<div class="finding-head">',
      '<span class="finding-num"></span>',
      '<div style="display:flex;align-items:center;gap:6px;">',
        '<button class="status-pill '+SCLS[f.status]+'" id="pill-'+id+'">'+SLBL[f.status]+'</button>',
        '<button class="remove-btn" id="rem-'+id+'">&times;</button>',
      '</div>',
    '</div>',
    '<div class="row"><label>Location</label><input type="text" id="loc-'+id+'" placeholder="e.g. Breaker #14" value="'+esc(f.location)+'"></div>',
    '<div class="row"><label>Max temp</label><input type="text" id="tmp-'+id+'" placeholder="e.g. 118\u00b0F" value="'+esc(f.temp)+'"></div>',
    '<div class="photo-pair">',
      '<div class="photo-box" id="tb-'+id+'">',
        '<input type="file" accept="image/*" id="tfi-'+id+'">',
        '<div class="photo-box-ico">&#128293;</div>',
        '<div class="photo-box-lbl">Thermal photo</div>',
        '<button class="photo-clear" id="tc-'+id+'" style="display:none;">&#10005; Remove</button>',
      '</div>',
      '<div class="photo-box" id="vb-'+id+'">',
        '<input type="file" accept="image/*" id="vfi-'+id+'">',
        '<div class="photo-box-ico">&#128247;</div>',
        '<div class="photo-box-lbl">Visible photo</div>',
        '<button class="photo-clear" id="vc-'+id+'" style="display:none;">&#10005; Remove</button>',
      '</div>',
    '</div>',
    '<div style="padding:0 14px 12px;"><textarea class="finding-notes" id="notes-'+id+'" placeholder="Notes on this finding...">'+esc(f.notes)+'</textarea></div>'
  ].join('');

  document.getElementById('findings-list').appendChild(d);

  // Attach events with addEventListener -- no inline handlers
  document.getElementById('pill-'+id).addEventListener('click',function(){cycleStatus(id);});
  document.getElementById('rem-'+id).addEventListener('click',function(){removeFinding(id);});
  document.getElementById('loc-'+id).addEventListener('input',function(){setF(id,'location',this.value);});
  document.getElementById('tmp-'+id).addEventListener('input',function(){setF(id,'temp',this.value);});
  document.getElementById('notes-'+id).addEventListener('input',function(){setF(id,'notes',this.value);});
  document.getElementById('tfi-'+id).addEventListener('change',function(){doPhoto(id,'thermal',this);});
  document.getElementById('vfi-'+id).addEventListener('change',function(){doPhoto(id,'visible',this);});
  document.getElementById('tc-'+id).addEventListener('click',function(e){e.stopPropagation();clearPhoto(id,'thermal');});
  document.getElementById('vc-'+id).addEventListener('click',function(e){e.stopPropagation();clearPhoto(id,'visible');});

  if(f.thermalSrc) restorePhoto(id,'thermal',f.thermalSrc);
  if(f.visibleSrc) restorePhoto(id,'visible',f.visibleSrc);
  renumberFindings();
  updateBar();
}

function renumberFindings(){
  document.querySelectorAll('.finding').forEach(function(card,i){
    var span=card.querySelector('.finding-num');
    if(span) span.textContent='Finding #'+(i+1);
  });
}

function cycleStatus(id){
  var obj=findings.find(function(f){return f.id===id;});
  var i=SCYCLE.indexOf(obj.status);
  obj.status=SCYCLE[(i+1)%3];
  var p=document.getElementById('pill-'+id);
  p.textContent=SLBL[obj.status];
  p.className='status-pill '+SCLS[obj.status];
  updateBar();autoSave();
}

function setF(id,field,val){
  var o=findings.find(function(f){return f.id===id;});
  if(o){o[field]=val;autoSave();}
}

function doPhoto(id,type,input){
  if(!input.files||!input.files[0]) return;
  var r=new FileReader();
  r.onload=function(e){
    var o=findings.find(function(f){return f.id===id;});
    if(o) o[type+'Src']=e.target.result;
    var src=e.target.result;
    setPhotoInBox(id,type,src);
    autoSave();
  };
  r.readAsDataURL(input.files[0]);
}

function setPhotoInBox(id,type,src){
  var prefix=type==='thermal'?'tb':'vb';
  var clearId=type==='thermal'?'tc':'vc';
  var box=document.getElementById(prefix+'-'+id);
  var old=box.querySelector('img');if(old)old.remove();
  var img=document.createElement('img');
  img.src=src;
  img.addEventListener('click',function(e){
    e.stopPropagation();
    openLightbox(src);
  });
  box.insertBefore(img,box.firstChild);
  box.classList.add('loaded');
  var clrBtn=document.getElementById(clearId+'-'+id);
  if(clrBtn) clrBtn.style.display='block';
}

function restorePhoto(id,type,src){
  setPhotoInBox(id,type,src);
}

function clearPhoto(id,type){
  var o=findings.find(function(f){return f.id===id;});
  if(o) o[type+'Src']=null;
  var prefix=type==='thermal'?'tb':'vb';
  var clearId=type==='thermal'?'tc':'vc';
  var box=document.getElementById(prefix+'-'+id);
  var img=box.querySelector('img');if(img)img.remove();
  box.classList.remove('loaded');
  var clrBtn=document.getElementById(clearId+'-'+id);
  if(clrBtn) clrBtn.style.display='none';
  var fi=document.getElementById((type==='thermal'?'tfi':'vfi')+'-'+id);
  if(fi) fi.value='';
  autoSave();
}

function removeFinding(id){
  var i=findings.findIndex(function(f){return f.id===id;});
  if(i>-1) findings.splice(i,1);
  var el=document.getElementById('finding-'+id);if(el)el.remove();
  renumberFindings();updateBar();autoSave();
}

function updateBar(){
  document.getElementById('sum-ok').textContent=findings.filter(function(f){return f.status==='ok';}).length;
  document.getElementById('sum-mon').textContent=findings.filter(function(f){return f.status==='monitor';}).length;
  document.getElementById('sum-act').textContent=findings.filter(function(f){return f.status==='action';}).length;
}

// ---- LIGHTBOX ----
function openLightbox(src){
  document.getElementById('lightbox-img').src=src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src='';
}
document.getElementById('lightbox').addEventListener('click',closeLightbox);
document.getElementById('lightbox-close').addEventListener('click',function(e){e.stopPropagation();closeLightbox();});

// ---- AUTO SAVE ----
function autoSave(){
  clearTimeout(saveTimer);
  var dot=document.getElementById('save-dot');
  if(dot){dot.style.opacity='1';dot.style.background='#ff9500';}
  saveTimer=setTimeout(commitSave,800);
}

function commitSave(){
  var snap=getSnapshot();
  if(!snap.custName&&findings.length===0) return;
  if(!currentId) currentId='insp-'+Date.now();
  snap.id=currentId;
  snap.savedAt=new Date().toISOString();
  var records=loadRecords();
  var idx=records.findIndex(function(r){return r.id===currentId;});
  if(idx>-1) records[idx]=snap; else records.unshift(snap);
  try{localStorage.setItem('bakken_inspections',JSON.stringify(records));}catch(e){}
  var dot=document.getElementById('save-dot');
  if(dot){dot.style.background='#34c759';}
  var lbl=document.getElementById('current-label');
  if(lbl) lbl.textContent=(snap.custName?snap.custName+' \u2014 ':'')+'auto saved';
}

function getSnapshot(){
  return {
    id:currentId,
    custName:document.getElementById('cust-name').value||'',
    custAddr:document.getElementById('cust-addr').value||'',
    inspDate:document.getElementById('insp-date').value||'',
    techName:document.getElementById('tech-name').value||'',
    memYear:document.getElementById('mem-year').value||'Year 1',
    nextVisit:document.getElementById('next-visit').value||'',
    overallNotes:document.getElementById('overall-notes').value||'',
    checked:Object.assign({},checked),
    findings:findings.map(function(f){return Object.assign({},f);}),
    savedAt:''
  };
}

function loadRecords(){
  try{var d=localStorage.getItem('bakken_inspections');return d?JSON.parse(d):[];}
  catch(e){return [];}
}

// ---- HISTORY ----
function renderHistory(){
  var records=loadRecords();
  var el=document.getElementById('hist-list');
  el.innerHTML='';
  document.getElementById('hist-count').textContent=records.length+' inspection'+(records.length!==1?'s':'')+' saved';
  if(records.length===0){
    el.innerHTML='<div class="empty-state"><div class="empty-icon">&#128203;</div><div class="empty-title">No inspections yet</div><div class="empty-sub">Complete your first inspection and it will appear here automatically.</div></div>';
    return;
  }
  records.forEach(function(r){
    var nOk=(r.findings||[]).filter(function(f){return f.status==='ok';}).length;
    var nMon=(r.findings||[]).filter(function(f){return f.status==='monitor';}).length;
    var nAct=(r.findings||[]).filter(function(f){return f.status==='action';}).length;
    var dateStr=r.inspDate?formatDate(r.inspDate):(r.savedAt?formatDate(r.savedAt.split('T')[0]):'Unknown date');
    var div=document.createElement('div');
    div.className='hist-item';
    var badges='';
    if(nOk) badges+='<span class="hist-badge hb-ok">'+nOk+' OK</span>';
    if(nMon) badges+='<span class="hist-badge hb-mon">'+nMon+' Monitor</span>';
    if(nAct) badges+='<span class="hist-badge hb-act">'+nAct+' Action</span>';
    if(!nOk&&!nMon&&!nAct) badges+='<span class="hist-badge" style="background:#f2f2f7;color:#8e8e93;">No findings</span>';
    div.innerHTML='<div class="hist-head"><div><div class="hist-name">'+(r.custName||'Unnamed customer')+'</div><div class="hist-date">'+dateStr+(r.techName?' &middot; '+r.techName:'')+'</div></div><div class="hist-badges">'+badges+'</div></div>'+
      '<div class="hist-actions">'+
      '<button class="hist-btn" id="edit-'+r.id+'">&#9998; Edit</button>'+
      '<button class="hist-btn" id="rep-'+r.id+'">&#128196; Report</button>'+
      '<button class="hist-btn danger" id="del-'+r.id+'">&#128465; Delete</button>'+
      '</div>';
    el.appendChild(div);
    document.getElementById('edit-'+r.id).addEventListener('click',function(){resumeInspection(r.id);});
    document.getElementById('rep-'+r.id).addEventListener('click',function(){regenReport(r.id);});
    document.getElementById('del-'+r.id).addEventListener('click',function(){deleteInspection(r.id);});
  });
}

function formatDate(s){
  if(!s) return '';
  var p=s.split('-');
  if(p.length<3) return s;
  var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return m[parseInt(p[1])-1]+' '+parseInt(p[2])+', '+p[0];
}

function resumeInspection(id){
  var records=loadRecords();
  var r=records.find(function(rec){return rec.id===id;});
  if(!r) return;
  loadSnapshot(r);
  switchTab('customer');
}

function loadSnapshot(r){
  currentId=r.id;
  document.getElementById('cust-name').value=r.custName||'';
  document.getElementById('cust-addr').value=r.custAddr||'';
  document.getElementById('insp-date').value=r.inspDate||'';
  document.getElementById('tech-name').value=r.techName||'';
  document.getElementById('mem-year').value=r.memYear||'Year 1';
  document.getElementById('next-visit').value=r.nextVisit||'12 months (standard)';
  document.getElementById('overall-notes').value=r.overallNotes||'';
  Object.assign(checked,r.checked||{});
  CHECKS.forEach(function(c){
    var b=document.getElementById('box-'+c.id);
    if(b){if(checked[c.id])b.classList.add('on');else b.classList.remove('on');}
  });
  var done=Object.values(checked).filter(Boolean).length;
  document.getElementById('ck-prog').textContent=done+' of '+CHECKS.length+' complete';
  findings.length=0;fc=0;
  document.getElementById('findings-list').innerHTML='';
  (r.findings||[]).forEach(function(f){addFinding(f);});
  updateBar();
  var lbl=document.getElementById('current-label');
  if(lbl) lbl.textContent=(r.custName||'')+' \u2014 loaded';
}

function deleteInspection(id){
  if(!confirm('Delete this inspection? This cannot be undone.')) return;
  var records=loadRecords().filter(function(r){return r.id!==id;});
  try{localStorage.setItem('bakken_inspections',JSON.stringify(records));}catch(e){}
  if(currentId===id) currentId=null;
  renderHistory();
}

function newInspection(){
  if(!confirm('Start a new inspection? Current data is already saved.')) return;
  currentId=null;fc=0;findings.length=0;
  CHECKS.forEach(function(c){checked[c.id]=false;});
  document.getElementById('findings-list').innerHTML='';
  ['cust-name','cust-addr','tech-name','overall-notes'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('insp-date').value=new Date().toISOString().split('T')[0];
  document.getElementById('mem-year').value='Year 1';
  document.getElementById('next-visit').value='12 months (standard)';
  CHECKS.forEach(function(c){var b=document.getElementById('box-'+c.id);if(b)b.classList.remove('on');});
  document.getElementById('ck-prog').textContent='0 of '+CHECKS.length+' complete';
  document.getElementById('current-label').textContent='Customer info';
  var dot=document.getElementById('save-dot');if(dot)dot.style.opacity='0';
  updateBar();
  addFinding();
  switchTab('customer');
}

// ---- REPORT ----
function badgeHtml(s){
  if(s==='monitor') return '<span style="background:#fef3c7;color:#92400e;font-size:12px;padding:3px 10px;border-radius:20px;font-weight:600;">Monitor</span>';
  if(s==='action') return '<span style="background:#fee2e2;color:#991b1b;font-size:12px;padding:3px 10px;border-radius:20px;font-weight:600;">Action required</span>';
  return '<span style="background:#d1fae5;color:#065f46;font-size:12px;padding:3px 10px;border-radius:20px;font-weight:600;">Normal</span>';
}

function buildReportHtml(snap){
  var name=snap.custName||'Customer';
  var addr=snap.custAddr||'';
  var date=snap.inspDate||'';
  var tech=snap.techName||'';
  var yr=snap.memYear||'';
  var notes=snap.overallNotes||'';
  var nxt=snap.nextVisit||'12 months (standard)';
  var fList=snap.findings||[];
  var ckState=snap.checked||{};
  var nOk=fList.filter(function(f){return f.status==='ok';}).length;
  var nMon=fList.filter(function(f){return f.status==='monitor';}).length;
  var nAct=fList.filter(function(f){return f.status==='action';}).length;

  var fHtml=fList.length===0?'<p style="color:#6b7280;font-size:14px;font-style:italic;padding:1rem 0;">No findings recorded.</p>':
    fList.map(function(f,i){
      var photos='';
      if(f.thermalSrc||f.visibleSrc){
        photos='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">';
        photos+=f.thermalSrc?'<div><p style="font-size:11px;color:#6b7280;margin-bottom:4px;">Thermal</p><img src="'+f.thermalSrc+'" style="width:100%;border-radius:6px;max-height:180px;object-fit:cover;"></div>':'<div></div>';
        photos+=f.visibleSrc?'<div><p style="font-size:11px;color:#6b7280;margin-bottom:4px;">Visible light</p><img src="'+f.visibleSrc+'" style="width:100%;border-radius:6px;max-height:180px;object-fit:cover;"></div>':'<div></div>';
        photos+='</div>';
      }
      return '<div style="border:1px solid #e5e7eb;border-radius:10px;padding:1rem;margin-bottom:1rem;page-break-inside:avoid;">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">'+
        '<span style="font-weight:600;font-size:15px;">Finding #'+(i+1)+(f.location?' \u2014 '+f.location:'')+' </span>'+badgeHtml(f.status)+'</div>'+
        photos+
        (f.temp?'<p style="font-size:13px;color:#374151;margin-bottom:6px;"><strong>Max temp:</strong> '+f.temp+'</p>':'')+
        (f.notes?'<p style="font-size:14px;color:#374151;line-height:1.6;">'+f.notes+'</p>':'')+
        '</div>';
    }).join('');

  var cats=[...new Set(CHECKS.map(function(c){return c.cat;}))];
  var clHtml='';
  cats.forEach(function(cat){
    clHtml+='<div style="margin-bottom:12px;"><p style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;">'+cat+'</p>';
    CHECKS.filter(function(c){return c.cat===cat;}).forEach(function(c){
      var done=!!ckState[c.id];
      clHtml+='<div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px;color:'+(done?'#111827':'#9ca3af')+';">'+
        '<span style="color:'+(done?'#059669':'#d1d5db')+';font-size:15px;">'+(done?'&#10003;':'&#9675;')+'</span>'+c.label+'</div>';
    });
    clHtml+='</div>';
  });

  return '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<title>Bakken Inspection '+name+'</title>'+
    '<style>body{font-family:Arial,sans-serif;color:#111827;margin:0;padding:0;}@media print{@page{margin:1.5cm;}}</style></head><body>'+
    '<div style="max-width:680px;margin:0 auto;padding:2rem;">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #111827;padding-bottom:1rem;margin-bottom:1.5rem;">'+
    '<img src="data:image/jpeg;base64,'+LOGO+'" style="height:48px;width:auto;" alt="Bakken Electric">'+
    '<div style="text-align:right;"><p style="font-size:15px;font-weight:700;margin-bottom:2px;">Elite Protection Plan</p>'+
    '<p style="font-size:12px;color:#6b7280;">Annual electrical inspection report</p>'+
    '<p style="font-size:12px;color:#6b7280;margin-top:2px;">'+date+(tech?' &middot; Tech: '+tech:'')+' &middot; '+yr+'</p></div></div>'+
    '<div style="background:#f9fafb;border-radius:8px;padding:1rem;margin-bottom:1.5rem;">'+
    '<p style="font-size:16px;font-weight:600;">'+name+'</p>'+(addr?'<p style="font-size:13px;color:#6b7280;margin-top:3px;">'+addr+'</p>':'')+
    '</div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem;">'+
    '<div style="border:1px solid #e5e7eb;border-radius:8px;padding:12px;text-align:center;"><div style="font-size:26px;font-weight:700;color:#065f46;">'+nOk+'</div><div style="font-size:12px;color:#6b7280;margin-top:2px;">Normal</div></div>'+
    '<div style="border:1px solid #e5e7eb;border-radius:8px;padding:12px;text-align:center;"><div style="font-size:26px;font-weight:700;color:#92400e;">'+nMon+'</div><div style="font-size:12px;color:#6b7280;margin-top:2px;">Monitor</div></div>'+
    '<div style="border:1px solid #e5e7eb;border-radius:8px;padding:12px;text-align:center;"><div style="font-size:26px;font-weight:700;color:#991b1b;">'+nAct+'</div><div style="font-size:12px;color:#6b7280;margin-top:2px;">Action required</div></div></div>'+
    '<h2 style="font-size:15px;font-weight:700;margin-bottom:1rem;border-bottom:1px solid #e5e7eb;padding-bottom:6px;">Thermal findings</h2>'+fHtml+
    '<h2 style="font-size:15px;font-weight:700;margin:1.5rem 0 1rem;border-bottom:1px solid #e5e7eb;padding-bottom:6px;">Inspection checklist</h2>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 2rem;">'+clHtml+'</div>'+
    (notes?'<h2 style="font-size:15px;font-weight:700;margin:1.5rem 0 1rem;border-bottom:1px solid #e5e7eb;padding-bottom:6px;">Technician summary</h2><p style="font-size:14px;line-height:1.7;">'+notes+'</p>':'')+
    '<div style="background:#f9fafb;border-radius:8px;padding:1rem;margin-top:1.5rem;"><p style="font-size:13px;"><strong>Next recommended visit:</strong> '+nxt+'</p></div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-top:2rem;padding-top:1.5rem;border-top:1px solid #e5e7eb;">'+
    '<div><p style="font-size:12px;color:#6b7280;margin-bottom:4px;">Customer signature</p><div style="border-bottom:1.5px solid #374151;height:40px;"></div><p style="font-size:11px;color:#9ca3af;margin-top:4px;">I have reviewed the findings above</p></div>'+
    '<div><p style="font-size:12px;color:#6b7280;margin-bottom:4px;">Technician signature</p><div style="border-bottom:1.5px solid #374151;height:40px;"></div><p style="font-size:11px;color:#9ca3af;margin-top:4px;">'+(tech||'Bakken Electric technician')+'</p></div></div>'+
    '<div style="border-top:1px solid #e5e7eb;margin-top:2rem;padding-top:1rem;display:flex;justify-content:space-between;align-items:center;">'+
    '<img src="data:image/jpeg;base64,'+LOGO+'" style="height:28px;width:auto;opacity:0.5;" alt="Bakken Electric">'+
    '<p style="font-size:11px;color:#9ca3af;">bakkenelectric.com &middot; For property owner records.</p></div></div>'+
    '<script>window.onload=function(){window.print();}<\/script></body></html>';
}

function generateReport(){
  commitSave();
  var html=buildReportHtml(getSnapshot());
  var blob=new Blob([html],{type:'text/html'});
  window.open(URL.createObjectURL(blob),'_blank');
}

function regenReport(id){
  var r=loadRecords().find(function(rec){return rec.id===id;});
  if(!r) return;
  var html=buildReportHtml(r);
  var blob=new Blob([html],{type:'text/html'});
  window.open(URL.createObjectURL(blob),'_blank');
}

// ---- WIRE UP STATIC BUTTONS ----
document.getElementById('new-btn').addEventListener('click', newInspection);
document.getElementById('add-finding-btn').addEventListener('click', function(){addFinding();});
document.getElementById('gen-report-btn').addEventListener('click', generateReport);
document.getElementById('new-insp-btn').addEventListener('click', newInspection);

['cust-name','cust-addr','insp-date','tech-name','mem-year','next-visit','overall-notes'].forEach(function(id){
  var el=document.getElementById(id);
  if(el) el.addEventListener('input',autoSave);
  if(el) el.addEventListener('change',autoSave);
});

buildCL();
document.getElementById('insp-date').value=new Date().toISOString().split('T')[0];
addFinding();
